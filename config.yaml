project:
  name: regional-mobility-profiles
  random_seed: 42

paths:
  raw_data: data/raw/Global_Mobility_Report.csv
  interim: data/interim/
  processed: data/processed/
  figures: outputs/figures/
  tables: outputs/tables/
  models: outputs/models/

features:
  mobility_columns:
    - retail_and_recreation_percent_change_from_baseline
    - grocery_and_pharmacy_percent_change_from_baseline
    - parks_percent_change_from_baseline
    - transit_stations_percent_change_from_baseline
    - workplaces_percent_change_from_baseline
    - residential_percent_change_from_baseline
  composite_columns:
       - retail_and_recreation
       - transit_stations
       - workplaces
  min_period_coverage: 0.70
  smoothing_days: 7
  recovery_threshold: -10

# Pandemic periods. Editable; we will justify these in the report.
periods:
  pre_pandemic:    ["2020-02-15", "2020-03-10"]
  first_wave:      ["2020-03-11", "2020-06-30"]
  reopening_2020:  ["2020-07-01", "2020-10-31"]
  winter_wave:     ["2020-11-01", "2021-02-28"]
  delta_wave:      ["2021-04-01", "2021-08-31"]
  omicron_wave:    ["2021-12-01", "2022-03-31"]
  late_pandemic:   ["2022-04-01", "2022-10-15"]

clustering:
  k_range: [2, 10]
  distances: [euclidean, manhattan]
  n_init: 20
  bootstrap_runs: 50

preprocessing:
  max_missing_fraction: 0.30   # drop a region if any feature is missing more than this
  max_gap_days: 14             # only interpolate gaps up to this length
  edge_fill_days: 7            # fill at most this many days at series start or end
  scaler: standard